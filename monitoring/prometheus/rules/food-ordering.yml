groups:
  - name: food-ordering-availability
    rules:
      - alert: FoodOrderingAPIUnavailable
        expr: up{job="food-ordering-api"} == 0
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Food-ordering API is unavailable
          description: Prometheus cannot scrape the API metrics endpoint.

      - alert: FoodOrderingWorkerUnavailable
        expr: up{job="food-ordering-worker"} == 0
        for: 5m
        labels:
          severity: critical
          service: worker
        annotations:
          summary: Taskiq worker metrics are unavailable
          description: The worker may be stopped or its private metrics port is unreachable.

      - alert: FoodOrderingDispatcherUnavailable
        expr: up{job="food-ordering-dispatcher"} == 0
        for: 5m
        labels:
          severity: critical
          service: dispatcher
        annotations:
          summary: Outbox dispatcher metrics are unavailable
          description: The dispatcher may be stopped or its private metrics port is unreachable.

      - alert: FoodOrderingDependencyUnavailable
        expr: food_ordering_dependency_up == 0
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: A required API dependency is unavailable
          description: MongoDB or Redis readiness has been failing for five minutes.

  - name: food-ordering-api
    rules:
      - alert: FoodOrderingHighHTTP5xxRate
        expr: >-
          sum(rate(food_ordering_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(food_ordering_http_requests_total[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: critical
          service: api
        annotations:
          summary: API 5xx rate is above 5%
          description: More than 5% of API requests have failed with server errors for 10 minutes.

      - alert: FoodOrderingHighAPILatency
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(food_ordering_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: API p95 latency is above one second
          description: The API p95 request latency has exceeded one second for 10 minutes.

  - name: food-ordering-background-work
    rules:
      - alert: FoodOrderingStaleOutbox
        expr: food_ordering_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          service: dispatcher
        annotations:
          summary: Outbox contains stale pending work
          description: The oldest pending outbox event is older than five minutes.

      - alert: FoodOrderingDeadOutboxEvent
        expr: increase(food_ordering_outbox_events_total{outcome="dead"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: dispatcher
        annotations:
          summary: An outbox event was moved to dead-letter state
          description: Inspect dispatcher logs using the event correlation ID.

      - alert: FoodOrderingTaskFailures
        expr: increase(food_ordering_task_executions_total{outcome="failed"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: Background tasks are failing
          description: At least one background task failed during the last ten minutes.

      - alert: FoodOrderingLLMErrors
        expr: >-
          sum(rate(food_ordering_llm_errors_total[10m]))
          /
          clamp_min(sum(rate(food_ordering_llm_request_duration_seconds_count[10m])), 1)
          > 0.2
        for: 10m
        labels:
          severity: warning
          service: llm
        annotations:
          summary: LLM error ratio is above 20%
          description: Customer-agent LLM failures have exceeded 20% for 10 minutes.

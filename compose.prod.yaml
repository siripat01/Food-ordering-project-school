name: hiwkaw-production

services:
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/backend.env}
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    command: ["taskiq", "worker", "app.core.taskiq:broker"]
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/backend.env}
    restart: unless-stopped
    init: true
    # No expose/ports: the worker only consumes from Redis.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import redis; from app.core.config import get_settings;
          redis.Redis.from_url(get_settings().redis_url).ping()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dispatcher:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    command: ["python", "-m", "app.jobs.dispatcher"]
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/backend.env}
    restart: unless-stopped
    init: true
    # Run exactly one replica per deployment. Extra replicas are safe (claims
    # are atomic) but add no throughput.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pymongo; from app.core.config import get_settings;
          pymongo.MongoClient(get_settings().mongodb_uri.get_secret_value(),
          serverSelectionTimeoutMS=3000).admin.command("ping")
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    pull_policy: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
      TUNNEL_LOGLEVEL: info
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  private:
    driver: bridge

volumes:
  redis-data:

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./deploy/secrets/cloudflare-tunnel-token}

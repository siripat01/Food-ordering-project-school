global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: generic-webhook

receivers:
  - name: generic-webhook
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL}'
        send_resolved: true


name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.14-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global corepack@0.35.0
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing configuration fails
        run: |
          docker build --tag food-ordering-backend-ci apps/backend
          if docker run --rm food-ordering-backend-ci; then
            echo "Backend unexpectedly started without required configuration"
            exit 1
          fi
      - name: Build and smoke-test the Compose stack
        run: |
          set -eu
          ci_secret="$(openssl rand -hex 32)"
          printf '%s\n' \
            'APP_ENV=test' \
            'MONGODB_URI=mongodb://mongo:27017' \
            "JWT_SECRET=${ci_secret}" \
            'FRONTEND_URL=http://localhost:3000' \
            'BACKEND_URL=http://localhost:8000' \
            'CORS_ORIGINS=["http://localhost:3000"]' \
            'COOKIE_SECURE=false' \
            'LINE_ENABLED=false' \
            'LLM_ENABLED=false' \
            'RECOMMENDER_ENABLED=false' \
            'NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1' > .env.ci
          export FOOD_ORDERING_ENV_FILE=.env.ci
          cleanup() {
            docker compose down --volumes
            rm -f .env.ci
          }
          trap cleanup EXIT
          docker compose up --detach --build --wait
          curl --fail --silent http://localhost:8000/api/v1/health/live
          curl --fail --silent http://localhost:8000/api/v1/health/ready
          curl --fail --silent http://localhost:3000
          curl --fail --silent http://localhost:8000/metrics

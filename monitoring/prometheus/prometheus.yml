global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: food-ordering-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets:
          - backend:8000

  - job_name: food-ordering-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9101

  - job_name: food-ordering-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets:
          - dispatcher:9102

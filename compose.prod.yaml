name: hiwkaw-production

secrets:
  metrics_token:
    file: ${METRICS_TOKEN_FILE:?Set METRICS_TOKEN_FILE to a deployment secret file}

services:
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    secrets:
      - source: metrics_token
        target: metrics-token
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - private
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
      - --storage.path=/alertmanager
    expose:
      - "9093"
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:?Set ALERTMANAGER_WEBHOOK_URL}
    volumes:
      - alertmanager-data:/alertmanager
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    # Dokploy creates .env beside this Compose file; CI may override the path.
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    command: ["taskiq", "worker", "app.core.taskiq:broker"]
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    # No expose/ports: the worker only consumes from Redis.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import redis; from app.core.config import get_settings;
          redis.Redis.from_url(get_settings().redis_url).ping()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "9101"
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dispatcher:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image tag or digest}
    pull_policy: always
    command: ["python", "-m", "app.jobs.dispatcher"]
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    # Run exactly one replica per deployment. Extra replicas are safe (claims
    # are atomic) but add no throughput.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pymongo; from app.core.config import get_settings;
          pymongo.MongoClient(get_settings().mongodb_uri.get_secret_value(),
          serverSelectionTimeoutMS=3000).admin.command("ping")
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "9102"
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  private:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

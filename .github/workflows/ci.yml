name: CI and image publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      # A service container cannot start mongod with --replSet, and the
      # transactional outbox needs multi-document transactions.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0.14-jammy \
            mongod --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" \
              && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for _ in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval \
              "db.hello().isWritablePrimary" | grep -q true && break
            sleep 2
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - run: npm install --global corepack@0.35.0
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Verify missing configuration fails
        run: |
          docker build --tag food-ordering-backend-ci apps/backend
          if docker run --rm food-ordering-backend-ci; then
            echo "Backend unexpectedly started without required configuration"
            exit 1
          fi
      - name: Build and smoke-test the Compose stack
        run: |
          set -eu
          ci_jwt_secret="$(openssl rand -hex 32)"
          ci_recommendation_secret="$(openssl rand -hex 32)"
          printf '%s\n' \
            'APP_ENV=test' \
            'MONGODB_URI=mongodb://mongo:27017' \
            "JWT_SECRET=${ci_jwt_secret}" \
            "RECOMMENDATION_USER_REF_SECRET=${ci_recommendation_secret}" \
            'FRONTEND_URL=http://localhost:3000' \
            'BACKEND_URL=http://localhost:8000' \
            'CORS_ORIGINS=["http://localhost:3000"]' \
            'COOKIE_SECURE=false' \
            'LINE_ENABLED=false' \
            'LLM_ENABLED=false' \
            'RECOMMENDER_ENABLED=false' \
            'NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1' > .env.ci
          export FOOD_ORDERING_ENV_FILE=.env.ci
          cleanup() {
            docker compose down --volumes
            rm -f .env.ci .tunnel-token.ci
          }
          trap cleanup EXIT
          docker compose up --detach --build --wait
          curl --fail --silent http://localhost:8000/api/v1/health/live
          curl --fail --silent http://localhost:8000/api/v1/health/ready
          curl --fail --silent http://localhost:3000
          curl --fail --silent http://localhost:8000/metrics
          printf '%s' 'ci-tunnel-token-placeholder' > .tunnel-token.ci
          BACKEND_IMAGE='ghcr.io/example/hiwkaw-backend:sha-ci' \
            BACKEND_ENV_FILE='.env.ci' \
            CLOUDFLARE_TUNNEL_TOKEN_FILE='.tunnel-token.ci' \
            docker compose --file compose.prod.yaml config --quiet

  backend-image:
    name: Publish backend image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [containers]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment reference
        shell: bash
        run: |
          echo "### Backend container" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

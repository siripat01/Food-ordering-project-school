[project]
name = "food-ordering-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# TaskiqDepends is a dependency marker, like fastapi.Depends, not a live call.
extend-immutable-calls = ["taskiq.TaskiqDepends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["scripts"]

[[tool.mypy.overrides]]
module = ["linebot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require TEST_MONGODB_URI",
]
